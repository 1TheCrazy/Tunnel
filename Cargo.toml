[workspace]
members = [
    "crates/client/cli",
    "crates/client/gui",
    "crates/core", 
    "crates/node", 
    "crates/server"
]

resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
axum = { version = "0.8", features = ["macros", "ws"] }
axum-server = {
    version = "0.8",
    features = ["tls-rustls-no-provider"]
}
tunnel_core = { path = "crates/core" }
rand = "0.9"
base64 = "0.22"
reqwest = {
    version = "0.12",
    default-features = false,
    features = ["json", "rustls-tls", "http2"]
}
toml = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
tempfile = "3"
clap = { version = "4.6.1", features = ["derive"] }
tabled = "0.20"
humantime-serde = "1"
tauri = "2.11.5"
tauri-build = "2.4.1"
rcgen = "0.14"
rustls = {
    version = "0.23",
    default-features = false,
    features = ["std", "ring", "tls12"]
}
sha2 = "0.10"
hex = "0.4"
tokio-tungstenite = {
    version = "0.30",
    features = ["rustls-tls-webpki-roots"]
}
futures-util = "0.3"
