[workspace]
members = [
    "crates/core", 
    "crates/server"
]

resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
axum = { version = "0.8", features = ["macros"] }
tunnel_core = { path = "crates/core" }
rand = "0.9"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }