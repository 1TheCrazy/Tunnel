# Cross runs Cargo inside Docker images. The image extends Cross's target
# toolchain with the target-side Linux libraries needed by the Tauri GUI.
[target.x86_64-unknown-linux-gnu]
dockerfile = ".github/cross/Dockerfile"

[target.aarch64-unknown-linux-gnu]
dockerfile = ".github/cross/Dockerfile"

[target.armv7-unknown-linux-gnueabihf]
dockerfile = ".github/cross/Dockerfile"
