name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID containing the successful build artifacts
        required: true
        type: string
      tag:
        description: Existing tag to publish or update
        required: true
        type: string

# Build jobs only need to read the source. The publish job explicitly receives
# permission to create the release and upload its assets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: '["windows-latest"]'
            binary_suffix: .exe
          - platform: windows
            arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: '["windows-11-arm"]'
            binary_suffix: .exe
          - platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: '["ubuntu-latest"]'
            binary_suffix: ''
          - platform: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: '["ubuntu-latest"]'
            binary_suffix: ''
          - platform: linux
            arch: armv7
            target: armv7-unknown-linux-gnueabihf
            runner: '["ubuntu-latest"]'
            binary_suffix: ''
          - platform: linux
            arch: armv6
            target: arm-unknown-linux-gnueabihf
            runner: '["ubuntu-latest"]'
            binary_suffix: ''

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6

      - name: Install Linux GUI prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install Cross
        if: matrix.platform == 'linux'
        shell: bash
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add '${{ matrix.target }}'

      - name: Build CLI, node, and server
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = 'linux' ]; then
            cross build --locked --release --target '${{ matrix.target }}' -p tunnel_client_cli -p node -p server
          else
            cargo build --locked --release --target '${{ matrix.target }}' -p tunnel_client_cli -p node -p server
          fi

      - name: Install the GUI build tool
        if: matrix.arch != 'armv6'
        working-directory: crates/client/gui
        shell: bash
        run: npm install --no-package-lock

      - name: Build GUI installers
        if: matrix.arch != 'armv6'
        working-directory: crates/client/gui
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = 'linux' ]; then
            # Tauri's ARM AppImage tool (linuxdeploy) must run on the target
            # architecture. Cross compiles the app, but cannot execute that
            # ARM binary on this x64 runner. Debian and RPM installers do not
            # have that constraint, so build them for every Linux target.
            if [ '${{ matrix.arch }}' = 'x86_64' ]; then
              npx --no-install tauri build --runner cross --target '${{ matrix.target }}'
            else
              npx --no-install tauri build --runner cross --target '${{ matrix.target }}' --bundles deb,rpm
            fi
          else
            npx --no-install tauri build --target '${{ matrix.target }}'
          fi

      - name: Collect release assets
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
        run: |
          asset_directory="release-assets/${PLATFORM}-${ARCH}"
          mkdir -p "$asset_directory"
          cp "target/${TARGET}/release/tunnel_client_cli${BINARY_SUFFIX}" "$asset_directory/tunnel-client-cli-${PLATFORM}-${ARCH}${BINARY_SUFFIX}"
          cp "target/${TARGET}/release/node${BINARY_SUFFIX}" "$asset_directory/tunnel-node-${PLATFORM}-${ARCH}${BINARY_SUFFIX}"
          cp "target/${TARGET}/release/server${BINARY_SUFFIX}" "$asset_directory/tunnel-server-${PLATFORM}-${ARCH}${BINARY_SUFFIX}"
          if [ '${{ matrix.arch }}' != 'armv6' ]; then
            while IFS= read -r -d '' installer; do
              installer_name=$(basename "$installer")
              cp "$installer" "$asset_directory/tunnel-gui-${PLATFORM}-${ARCH}-${installer_name}"
            done < <(find "target/${TARGET}/release/bundle" -type f \( \
              -name '*.msi' -o \
              -name '*-setup.exe' -o \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.AppImage' -o \
              -name 'tunnel-client-cli-*' -o \
              -name 'tunnel-node-*' -o \
              -name 'tunnel-server-*' \
            \) -print0)
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-assets-*
          path: release-assets

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/*/* \
            --title "$TAG" \
            --generate-notes

  republish:
    name: Publish existing build artifacts
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download installers from the previous run
        uses: actions/download-artifact@v5
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: release-assets-*
          path: downloaded-artifacts

      - name: Select release files only
        shell: bash
        run: |
          mkdir installers
          find downloaded-artifacts -type f \( \
            -name '*.msi' -o \
            -name '*-setup.exe' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.AppImage' -o \
            -name 'tunnel-client-cli-*' -o \
            -name 'tunnel-node-*' -o \
            -name 'tunnel-server-*' \
          \) -exec cp {} installers/ \;
          test -n "$(find installers -maxdepth 1 -type f -print -quit)"

      - name: Create or update the release with installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          while IFS= read -r asset; do
            case "$asset" in
              *.msi|*-setup.exe|*.deb|*.rpm|*.AppImage|tunnel-client-cli-*|tunnel-node-*|tunnel-server-*) ;;
              *) gh release delete-asset "$TAG" "$asset" --yes ;;
            esac
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          gh release upload "$TAG" installers/* --clobber
